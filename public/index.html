<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Domino Pro Kurd</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;700;900&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Noto Sans Arabic',sans-serif;
}

body{
background:#0f172a;
color:white;
overflow-x:hidden;
}

.screen{
display:none;
min-height:100vh;
padding:20px;
}

.active{
display:block;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.logo{
font-size:32px;
font-weight:900;
color:#38bdf8;
}

.card{
background:#1e293b;
border-radius:20px;
padding:20px;
margin-bottom:20px;
box-shadow:0 0 20px rgba(0,0,0,.3);
}

input{
width:100%;
padding:15px;
border:none;
border-radius:15px;
background:#334155;
color:white;
font-size:16px;
margin-top:10px;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:15px;
font-size:16px;
font-weight:bold;
margin-top:10px;
cursor:pointer;
transition:.2s;
}

button:hover{
transform:scale(1.02);
}

.primary{
background:#0ea5e9;
color:white;
}

.success{
background:#22c55e;
color:white;
}

.danger{
background:#ef4444;
color:white;
}

.secondary{
background:#475569;
color:white;
}

.players{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.player{
background:#334155;
padding:15px;
border-radius:15px;
text-align:center;
}

.board{
min-height:180px;
background:#0f172a;
border:2px dashed #334155;
border-radius:20px;
padding:15px;
display:flex;
flex-wrap:wrap;
gap:10px;
justify-content:center;
align-items:center;
}

.domino{
width:60px;
height:120px;
background:white;
color:black;
border-radius:12px;
display:flex;
flex-direction:column;
justify-content:space-between;
padding:10px;
font-weight:bold;
cursor:pointer;
transition:.2s;
}

.domino:hover{
transform:translateY(-5px);
}

.domino .half{
height:50%;
display:flex;
justify-content:center;
align-items:center;
font-size:24px;
}

.hand{
display:flex;
gap:10px;
overflow-x:auto;
padding-bottom:10px;
margin-top:20px;
}

.turn{
background:#22c55e;
padding:10px;
border-radius:12px;
text-align:center;
margin-bottom:10px;
font-weight:bold;
}

.settings-item{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px;
background:#334155;
border-radius:12px;
margin-top:10px;
}

.switch{
width:50px;
height:28px;
background:#64748b;
border-radius:999px;
position:relative;
cursor:pointer;
}

.switch::after{
content:'';
position:absolute;
width:22px;
height:22px;
background:white;
border-radius:50%;
top:3px;
right:3px;
transition:.2s;
}

.switch.active{
background:#22c55e;
}

.switch.active::after{
right:25px;
}

.bottom{
height:100px;
}

h2{
margin-bottom:10px;
}

.code{
font-size:30px;
font-weight:900;
letter-spacing:5px;
text-align:center;
margin-top:15px;
color:#38bdf8;
}

.small{
opacity:.7;
font-size:14px;
margin-top:5px;
}

.center{
text-align:center;
}

.win{
font-size:28px;
font-weight:900;
color:#22c55e;
text-align:center;
margin-top:20px;
}

</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen" class="screen active">

<div class="topbar">
<div class="logo">DOMINO PRO</div>
</div>

<div class="card">
<h2>بەخێربێیت</h2>

<input id="playerName" placeholder="ناوی یاریزان"/>

<button class="primary" onclick="createRoom()">
دروستکردنی ژوور
</button>

<input id="roomCodeInput" placeholder="کۆدی ژوور"/>

<button class="success" onclick="joinRoom()">
چوونە ژوور
</button>

<button class="secondary" onclick="openSettings()">
سێتینگ
</button>

</div>
</div>

<!-- LOBBY -->
<div id="lobbyScreen" class="screen">

<div class="topbar">
<div class="logo">LOBBY</div>
</div>

<div class="card">
<h2>کۆدی ژوور</h2>

<div class="code" id="roomCodeText">
ABCD
</div>

<div class="small center">
هاوڕێکانت بانگهێشت بکە
</div>
</div>

<div class="card">
<h2>یاریزانەکان</h2>

<div class="players" id="playersList"></div>

<button class="primary" onclick="startGame()">
دەستپێکردنی یاری
</button>

</div>

</div>

<!-- GAME -->
<div id="gameScreen" class="screen">

<div class="topbar">
<div class="logo">DOMINO</div>
</div>

<div id="turnText" class="turn">
نۆرەی تۆیە
</div>

<div class="board" id="board"></div>

<h2 style="margin-top:20px;">دەستەکەت</h2>

<div class="hand" id="hand"></div>

<div class="bottom"></div>

</div>

<!-- SETTINGS -->
<div id="settingsScreen" class="screen">

<div class="topbar">
<div class="logo">SETTINGS</div>
</div>

<div class="card">

<div class="settings-item">
<span>ساوند</span>
<div class="switch active" onclick="toggleSwitch(this)"></div>
</div>

<div class="settings-item">
<span>باک ساوند</span>
<div class="switch active" onclick="toggleSwitch(this)"></div>
</div>

<div class="settings-item">
<span>AI Bot</span>
<div class="switch active" onclick="toggleSwitch(this)"></div>
</div>

<button class="primary" onclick="backHome()">
گەڕانەوە
</button>

</div>

</div>

<audio id="clickSound">
<source src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3">
</audio>

<script>

let roomCode="ABCD"

let players=[
{name:"Dana"},
{name:"Bot 1"}
]

let myHand=[
{left:6,right:6},
{left:5,right:2},
{left:1,right:3},
{left:4,right:4}
]

let board=[]

function showScreen(id){

document.querySelectorAll('.screen').forEach(s=>{
s.classList.remove('active')
})

document.getElementById(id).classList.add('active')

}

function playSound(){
document.getElementById('clickSound').play()
}

function createRoom(){

playSound()

roomCode=Math.random().toString(36).substring(2,6).toUpperCase()

document.getElementById('roomCodeText').innerText=roomCode

renderPlayers()

showScreen('lobbyScreen')

}

function joinRoom(){

playSound()

showScreen('lobbyScreen')

renderPlayers()

}

function renderPlayers(){

const list=document.getElementById('playersList')

list.innerHTML=''

players.forEach(p=>{

list.innerHTML+=`
<div class="player">
${p.name}
</div>
`

})

}

function startGame(){

playSound()

renderBoard()

renderHand()

showScreen('gameScreen')

}

function renderBoard(){

const boardEl=document.getElementById('board')

boardEl.innerHTML=''

board.forEach(tile=>{

boardEl.innerHTML+=`
<div class="domino">
<div class="half">${tile.left}</div>
<div class="half">${tile.right}</div>
</div>
`

})

}

function renderHand(){

const hand=document.getElementById('hand')

hand.innerHTML=''

myHand.forEach((tile,index)=>{

hand.innerHTML+=`
<div class="domino" onclick="playTile(${index})">
<div class="half">${tile.left}</div>
<div class="half">${tile.right}</div>
</div>
`

})

}

function playTile(index){

playSound()

const tile=myHand[index]

board.push(tile)

myHand.splice(index,1)

renderBoard()

renderHand()

if(myHand.length===0){

document.getElementById('board').innerHTML+=`
<div class="win">
بردتەوە 🎉
</div>
`

}

}

function openSettings(){

playSound()

showScreen('settingsScreen')

}

function backHome(){

playSound()

showScreen('loginScreen')

}

function toggleSwitch(el){

el.classList.toggle('active')

playSound()

}

</script>

</body>
</html>
