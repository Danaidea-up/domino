<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>دۆمینۆ PRO</title><script src="/socket.io/socket.io.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--wood:#7a3f18;--wood2:#c07833;--chalk:#e8f1df;--red:#ff6b7a;--gold:#ffd166;--green:#21e6a8;--blue:#42a5ff}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#050505;color:var(--chalk);min-height:100vh;overflow-x:hidden;background-image:radial-gradient(circle at 50% 0,#303030 0,#0b0b0b 45%,#000 100%)}
.app{max-width:520px;margin:auto;min-height:100vh;background:#101010;border-left:1px solid #252525;border-right:1px solid #252525;box-shadow:0 0 60px #000;padding:0 12px 20px}.screen{display:none;animation:fade .25s}.screen.active{display:block}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.top{position:sticky;top:0;z-index:4;margin:0 -12px 14px;padding:14px 12px 10px;background:#111;border-bottom:5px solid var(--wood2);box-shadow:0 8px 20px #000}.top:after{content:"";display:block;height:5px;background:linear-gradient(90deg,var(--wood),var(--wood2),var(--wood));position:absolute;left:0;right:0;bottom:-8px}.logo{font-size:26px;font-weight:900;text-shadow:2px 2px #000;color:#fff}.sub{font-size:13px;color:#d0d0c8}.badge{background:#181818;border:2px solid #3a3a3a;color:#fff;border-radius:12px;padding:6px 10px;font-weight:900;box-shadow:inset 0 0 16px #000}.grid{display:block}
.card{background:#1a1f22;border:2px solid #303840;border-radius:18px;margin:16px 0;padding:16px;box-shadow:inset 0 0 35px #000,0 12px 22px #0008}.card h3{font-size:24px;margin:0 0 14px;text-align:right;color:#fff;text-shadow:2px 2px #000}.board{min-height:355px;background:#111719;border:4px solid #343a3f;border-radius:12px;padding:18px;display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap;box-shadow:inset 0 0 60px #000;background-image:radial-gradient(circle at 50% 20%,#20282a,#0e1112 60%)}.board:empty:before{content:'تەختەی یاری';color:#6f7777;font-size:22px}.hand{display:flex;gap:10px;overflow-x:auto;padding:12px 4px 18px}.domino{min-width:54px;height:105px;background:linear-gradient(#fff,#e9e3d7);color:#111;border-radius:10px;padding:6px;display:flex;flex-direction:column;justify-content:space-between;border:3px solid #111;box-shadow:0 7px 12px #000b;animation:drop .22s ease;font-weight:900}.domino.small{min-width:38px;height:72px;border-radius:8px;padding:4px;transform:rotate(90deg);margin:4px 18px}.half{height:49%;display:grid;place-items:center;font-size:25px;border-bottom:2px solid #333}.domino.small .half{font-size:17px}.half:last-child{border-bottom:0}@keyframes drop{from{transform:translateY(-22px) scale(.9);opacity:.1}to{transform:none;opacity:1}}
input,select{width:100%;padding:14px;margin:7px 0;border:2px solid #343a3f;border-radius:12px;background:#0b0d0e;color:#fff;font-size:16px}button{width:100%;border:0;border-radius:12px;padding:14px;margin:7px 0;background:linear-gradient(180deg,#31363d,#171b20);color:#fff;font-weight:900;font-size:16px;box-shadow:0 6px 0 #060606,0 12px 18px #0008}button:active{transform:translateY(4px);box-shadow:0 2px 0 #060606}.gold{background:linear-gradient(180deg,#ffe08a,#b56c19);color:#211000}.ghost{background:linear-gradient(180deg,#444,#1b1b1b)}.danger{background:linear-gradient(180deg,#ff7280,#76101b)}.row{display:flex;gap:8px}.row>*{flex:1}.player{display:flex;align-items:center;gap:10px;background:#111;border:2px solid #333;border-radius:14px;padding:10px;margin:8px 0}.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#19e6a8,#3fa2ff);display:grid;place-items:center;font-size:24px;color:#111}.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat div{background:#111;border:2px solid #333;border-radius:12px;padding:10px;text-align:center}.turn{font-size:22px;text-align:center;color:#111;background:var(--green);font-weight:900;border-radius:0 0 18px 18px;padding:14px;margin:0 -2px 14px;box-shadow:0 5px 0 #0b7d5f}.toast{position:fixed;bottom:16px;left:16px;right:16px;max-width:500px;margin:auto;background:#111;border:2px solid #555;border-radius:14px;padding:14px;text-align:center;display:none;z-index:9}.colorDot{height:36px;border-radius:12px;border:2px solid #fff5}.c1{background:#20e3b2}.c2{background:#4b7cff}.c3{background:#ff4d6d}.c4{background:#ffd166}.scorebar{display:grid;grid-template-columns:1fr auto 1fr auto;gap:8px;align-items:center;font-weight:900;font-size:18px;color:#eee;text-shadow:2px 2px #000}.scorebar .num{font-size:30px;color:#fff}.scorebar .vs{color:var(--gold)}
#game .top{padding-bottom:12px}.game-shell{background:#060606;border-radius:0 0 24px 24px;padding:0 0 12px}.section-title{font-size:22px;font-weight:900;margin:8px 0;color:#fff;text-shadow:2px 2px #000}@media(max-width:420px){.app{max-width:100%;padding:0 10px}.board{min-height:330px}.domino{min-width:50px;height:98px}.logo{font-size:23px}}
</style></head><body><div class="app">
<section id="home" class="screen active"><div class="top"><div><div class="logo">🎲 دۆمینۆ PRO</div><div class="sub">Quick Match، ئۆنڵاین، AI Bot، خاڵ و ڕیتبە</div></div><span class="badge" id="rankText">ڕیتبە</span></div><div class="grid"><div class="card"><h3>ئەکاونت</h3><input id="nameInput" placeholder="ناوی خۆت"><select id="avatarInput"><option>😀</option><option>😎</option><option>🦁</option><option>🔥</option><option>⭐</option></select><button onclick="saveProfile()">پاشەکەوتکردنی ئەکاونت</button><div class="stat"><div><b id="wins">0</b><br>بردنەوە</div><div><b id="losses">0</b><br>دۆڕان</div><div><b id="points">0</b><br>خاڵ</div></div></div><div class="card"><h3>دەستپێکردن</h3><button class="gold" onclick="quickMatch()">⚡ Quick Match دژی AI</button><button onclick="createOnlineRoom()">ژووری ئۆنڵاین دروست بکە</button><input id="joinCode" placeholder="کۆدی ژوور"><button onclick="joinOnlineRoom()">پەیوەستبوون بە ژوور</button><button class="ghost" onclick="show('settings')">⚙️ سێتینگ</button></div></div></section>
<section id="settings" class="screen"><div class="top"><div class="logo">⚙️ سێتینگ</div></div><div class="card"><label>ئاستی AI</label><select id="aiLevel"><option value="easy">ئاسان</option><option value="medium">ناوەند</option><option value="hard">سەخت</option></select><label>دەنگ</label><select id="soundOn"><option value="on">چالاک</option><option value="off">کوژاوە</option></select><label>باک ساوند</label><select id="musicOn"><option value="on">چالاک</option><option value="off">کوژاوە</option></select><label>ڕەنگ</label><div class="row"><button class="colorDot c1" onclick="theme('#20e3b2')"></button><button class="colorDot c2" onclick="theme('#4b7cff')"></button><button class="colorDot c3" onclick="theme('#ff4d6d')"></button><button class="colorDot c4" onclick="theme('#ffd166')"></button></div><button onclick="saveSettings()">پاشەکەوتکردن</button><button class="ghost" onclick="show('home')">گەڕانەوە</button></div></section>
<section id="lobby" class="screen"><div class="top"><div class="logo">🏠 لۆبی</div><span class="badge" id="roomCode">----</span></div><div class="card"><h3>یاریزانەکان</h3><div id="lobbyPlayers"></div><button onclick="startOnline()">دەستپێکردنی یاری</button><button class="ghost" onclick="addBot()">+ زیادکردنی AI Bot</button><button class="danger" onclick="show('home')">دەرچوون</button></div></section>
<section id="game" class="screen"><div class="top"><div class="scorebar"><span>Me</span><span class="num" id="meCount">0</span><span>Him</span><span class="num" id="himCount">0</span></div><div class="sub"><span id="gameMode">Quick Match</span> · Board <span id="boardCount">0</span> · Boneyard <span id="boneCount">0</span></div></div><div id="turnBox" class="turn">نۆرەی تۆیە</div><div class="card"><h3>تەختە</h3><div id="board" class="board"></div></div><div class="card"><h3>دەستەکەت</h3><div id="hand" class="hand"></div><div class="row"><button onclick="drawTile()">وەرگرتنی دۆمینۆ</button><button class="ghost" onclick="passTurn()">پاس</button></div></div><div class="card"><h3>یاریزانەکان</h3><div id="gamePlayers"></div></div><button class="danger" onclick="show('home')">گەڕانەوە</button></section>
</div><div id="toast" class="toast"></div>
<script>
let socket=null;try{socket=io()}catch(e){}
let profile=JSON.parse(localStorage.getItem('domino_profile')||'{"name":"یاریزان","avatar":"😀","wins":0,"losses":0,"points":0}');let settings=JSON.parse(localStorage.getItem('domino_settings')||'{"ai":"medium","sound":"on","music":"on"}');let mode='local',hand=[],botHand=[],board=[],boneyard=[],players=[],myTurn=true,online=false;
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active')}function toast(t){let x=document.getElementById('toast');x.innerText=t;x.style.display='block';setTimeout(()=>x.style.display='none',2200)}function beep(type='click'){if(settings.sound==='off')return;let a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=type==='win'?740:type==='lose'?160:420;g.gain.value=.05;o.start();setTimeout(()=>{o.stop();a.close()},120)}
function saveProfile(){profile.name=nameInput.value||'یاریزان';profile.avatar=avatarInput.value;localStorage.setItem('domino_profile',JSON.stringify(profile));loadProfile();toast('ئەکاونت پاشەکەوت کرا');beep()}function saveSettings(){settings.ai=aiLevel.value;settings.sound=soundOn.value;settings.music=musicOn.value;localStorage.setItem('domino_settings',JSON.stringify(settings));toast('سێتینگ پاشەکەوت کرا');beep()}function rank(){let p=profile.points;if(p>500)return'ئەفسانەیی';if(p>250)return'پڕۆ';if(p>100)return'باش';return'نوێ'}function loadProfile(){nameInput.value=profile.name;avatarInput.value=profile.avatar;wins.innerText=profile.wins;losses.innerText=profile.losses;points.innerText=profile.points;scoreInfo.innerText=profile.points+' خاڵ';rankText.innerText='ڕیتبە: '+rank()}function theme(c){document.body.style.background=`radial-gradient(circle at top,${c},#0b1020 55%,#05070d)`}loadProfile();aiLevel.value=settings.ai;soundOn.value=settings.sound;musicOn.value=settings.music;
function makeTiles(){let a=[];for(let i=0;i<=6;i++)for(let j=i;j<=6;j++)a.push({l:i,r:j,id:i+'-'+j+'-'+Math.random()});return shuffle(a)}function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function ends(){if(!board.length)return{l:null,r:null};return{l:board[0].l,r:board[board.length-1].r}}function can(tile){if(!board.length)return true;let e=ends();return tile.l===e.l||tile.r===e.l||tile.l===e.r||tile.r===e.r}function place(tile,side='right'){if(!board.length){board.push(tile);return true}let e=ends();if(side==='left'){if(tile.r===e.l)board.unshift(tile);else if(tile.l===e.l)board.unshift({l:tile.r,r:tile.l,id:tile.id});else return false}else{if(tile.l===e.r)board.push(tile);else if(tile.r===e.r)board.push({l:tile.r,r:tile.l,id:tile.id});else return false}return true}
function quickMatch(){mode='local';online=false;gameMode.innerText='Quick Match دژی AI';let tiles=makeTiles();hand=tiles.splice(0,7);botHand=tiles.splice(0,7);boneyard=tiles;board=[];myTurn=true;players=[{name:profile.name,avatar:profile.avatar,count:hand.length},{name:'AI Bot',avatar:'🤖',count:botHand.length}];show('game');renderGame();toast('یاری خێرا دەستی پێکرد');beep()}
function domino(t,cls=''){return `<div class="domino ${cls}"><div class="half">${t.l}</div><div class="half">${t.r}</div></div>`}function renderGame(){boardEl=document.getElementById('board');boardEl.innerHTML=board.length?'':'<span class="sub">هێشتا هیچ دۆمینۆیەک دانەنراوە</span>';board.forEach(t=>boardEl.innerHTML+=domino(t,'small'));handEl=document.getElementById('hand');handEl.innerHTML='';hand.forEach((t,i)=>handEl.innerHTML+=`<div onclick="playLocal(${i})">${domino(t)}</div>`);gamePlayers.innerHTML=players.map(p=>`<div class="player"><div class="avatar">${p.avatar}</div><b>${p.name}</b><span class="badge">${p.count} دۆمینۆ</span></div>`).join('');turnBox.innerText=myTurn?'نۆرەی تۆیە':'نۆرەی یاریزانی ترە...'; if(document.getElementById('meCount')){meCount.innerText=hand.length;himCount.innerText=(players[1]?.count||0);boardCount.innerText=board.length;boneCount.innerText=boneyard.length}}
function playLocal(i){if(online){return playOnline(i)}if(!myTurn)return;let t=hand[i];if(!can(t))return toast('ئەم دۆمینۆیە ناگونجێت');if(!place(t,'right')&&!place(t,'left'))return toast('ناگونجێت');hand.splice(i,1);players[0].count=hand.length;beep();if(checkWin())return;myTurn=false;renderGame();setTimeout(botMove,700)}function botMove(){let playable=botHand.filter(can),choice=null;if(settings.ai==='easy')choice=playable[Math.floor(Math.random()*playable.length)];if(settings.ai==='medium')choice=playable.sort((a,b)=>(b.l+b.r)-(a.l+a.r))[0];if(settings.ai==='hard')choice=playable.sort((a,b)=>((b.l===b.r)*20+b.l+b.r)-((a.l===a.r)*20+a.l+a.r))[0];if(choice){place(choice,'right')||place(choice,'left');botHand=botHand.filter(x=>x.id!==choice.id);beep()}else if(boneyard.length){botHand.push(boneyard.pop())}players[1].count=botHand.length;if(checkWin())return;myTurn=true;renderGame()}function drawTile(){if(online&&socket)return socket.emit('drawTile');if(mode==='local'&&myTurn&&boneyard.length){hand.push(boneyard.pop());players[0].count=hand.length;renderGame();beep()}}function passTurn(){if(online&&socket)return socket.emit('passTurn');if(mode==='local'&&myTurn){myTurn=false;renderGame();setTimeout(botMove,600)}}function checkWin(){if(hand.length===0){profile.wins++;profile.points+=30;localStorage.setItem('domino_profile',JSON.stringify(profile));loadProfile();renderGame();toast('تۆ بردتەوە 🎉');beep('win');return true}if(botHand.length===0){profile.losses++;profile.points=Math.max(0,profile.points-10);localStorage.setItem('domino_profile',JSON.stringify(profile));loadProfile();renderGame();toast('AI بردیەوە');beep('lose');return true}return false}
function createOnlineRoom(){if(!socket)return toast('سێرڤەر پەیوەست نییە');socket.emit('createRoom',{playerName:profile.avatar+' '+profile.name,aiLevel:settings.ai})}function joinOnlineRoom(){if(!socket)return toast('سێرڤەر پەیوەست نییە');socket.emit('joinRoom',{roomId:joinCode.value,playerName:profile.avatar+' '+profile.name})}function startOnline(){if(socket)socket.emit('startGame')}function addBot(){if(socket)socket.emit('addBot')}function playOnline(i){if(!myTurn)return toast('نۆرەی تۆ نییە');let t=hand[i];socket.emit('playTile',{tileId:t.id,side:'right'})}
if(socket){socket.on('roomCreated',d=>{roomCode.innerText=d.roomId;show('lobby');toast('ژوور دروست کرا')});socket.on('roomJoined',d=>{roomCode.innerText=d.roomId;show('lobby');toast('چوویتە ژوور')});socket.on('lobbyUpdate',d=>{roomCode.innerText=d.roomId;lobbyPlayers.innerHTML=d.players.map(p=>`<div class="player"><div class="avatar">${p.isBot?'🤖':'🎮'}</div><b>${p.name}</b>${p.isHost?'<span class="badge">Host</span>':''}</div>`).join('')});socket.on('gameState',s=>{mode='online';online=true;gameMode.innerText='یاری ئۆنڵاین';hand=(s.yourHand||[]).map(t=>({l:t.left,r:t.right,id:t.id}));board=(s.board||[]).map(t=>({l:t.left,r:t.right,id:t.id}));myTurn=s.yourTurn;players=(s.players||[]).map(p=>({name:p.name,avatar:p.isBot?'🤖':'🎮',count:p.tilesCount}));show('game');renderGame();if(s.winner){toast('براوە: '+s.winner.name);if(!s.winner.isBot){profile.wins++;profile.points+=30}else{profile.losses++;profile.points=Math.max(0,profile.points-10)}localStorage.setItem('domino_profile',JSON.stringify(profile));loadProfile()}});socket.on('error',e=>toast(e.message||'هەڵە ڕوویدا'))}
</script></body></html>
