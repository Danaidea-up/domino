<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Domino Ultimate V2</title><script src="/socket.io/socket.io.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#063b22;color:#fff;font-family:Tahoma,Arial,sans-serif}.app{max-width:520px;margin:auto;min-height:100vh;background:radial-gradient(circle,#09884c,#052516 70%);padding:12px}.screen{display:none}.active{display:block}.top{display:flex;justify-content:space-between;align-items:center;background:#5b351e;border-radius:16px;padding:10px;border:3px solid #8b5a2b}.card{background:#0007;border:1px solid #ffffff33;border-radius:18px;padding:14px;margin:12px 0}button,input,select{width:100%;padding:13px;margin:7px 0;border:0;border-radius:14px;font-weight:900}button{background:linear-gradient(135deg,#f5d76e,#b7791f);color:#111}.blue{background:linear-gradient(135deg,#22d3ee,#3b82f6);color:#fff}.dark{background:#222;color:#fff}.danger{background:#dc2626;color:#fff}.board{min-height:430px;background:#087a43;border:10px solid #5b351e;border-radius:26px;box-shadow:inset 0 0 70px #000;position:relative;padding:14px;overflow:hidden}.line{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;align-items:center;min-height:210px}.hand{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:auto;background:#4a2a19;border-radius:22px 22px 0 0;padding:10px;display:flex;gap:6px;overflow:auto}.tile{width:46px;height:92px;background:#fff7d6;border:2px solid #25180c;border-radius:9px;display:flex;flex-direction:column;box-shadow:0 6px 10px #0008}.tile.ok{box-shadow:0 0 0 4px #ffe66d,0 0 20px #ffe66d}.half{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:4px;border-bottom:1px solid #333}.half:last-child{border-bottom:0}.pip{width:7px;height:7px;background:#111;border-radius:50%;align-self:center;justify-self:center}.players{display:grid;grid-template-columns:1fr 1fr;gap:8px}.player{background:#0006;border-radius:14px;padding:10px;text-align:center}.toast{position:fixed;bottom:115px;left:16px;right:16px;background:#111;padding:14px;border-radius:14px;text-align:center;display:none}
</style></head><body><div class="app">
<section id="home" class="screen active"><div class="top"><b>🎲 دۆمینۆ Ultimate V2</b><span id="rank">نوێ</span></div><div class="card"><input id="name" placeholder="ناوی خۆت"><select id="avatar"><option>🦁</option><option>😎</option><option>🔥</option><option>🎲</option></select><button onclick="save()">پاشەکەوتکردنی ئەکاونت</button><p id="stats">Coins: 0 | XP: 0</p></div><div class="card"><button class="blue" onclick="findMatch()">🌍 Matchmaking</button><button onclick="quickBot()">⚡ Quick Bot Match</button><button onclick="createRoom()">ژووری تایبەت</button><input id="code" placeholder="کۆدی ژوور"><button onclick="joinRoom()">چوونە ژوور</button><button class="dark" onclick="leaderboard()">🏆 Leaderboard</button></div><div id="leaders" class="card" style="display:none"></div></section>
<section id="lobby" class="screen"><div class="top"><button onclick="show('home')" class="dark">‹</button><b>Room <span id="room">----</span></b></div><div class="card"><div id="lobbyPlayers"></div><button onclick="addBot()">+ Bot</button><button class="blue" onclick="startGame()">دەستپێکردن</button></div></section>
<section id="game" class="screen"><div class="top"><button onclick="show('home')" class="dark">‹</button><b id="turn">نۆرە</b><span id="counts"></span></div><div class="board"><div id="board" class="line"></div><div id="players" class="players"></div><div style="height:110px"></div></div><div class="hand" id="hand"></div><div class="card"><button onclick="draw()">وەرگرتن</button><button class="dark" onclick="pass()">پاس</button></div></section>
</div><div id="toast" class="toast"></div>
<script>
const socket=io();let profile=JSON.parse(localStorage.getItem("p")||'{"playerId":"","name":"Player","avatar":"🦁"}');if(!profile.playerId){profile.playerId="p_"+Math.random().toString(36).slice(2);localStorage.setItem("p",JSON.stringify(profile))}
let state=null;name.value=profile.name;avatar.value=profile.avatar;register();
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));document.getElementById(id).classList.add("active")}
function msg(t){toast.innerText=t;toast.style.display="block";setTimeout(()=>toast.style.display="none",1800)}
function save(){profile.name=name.value||"Player";profile.avatar=avatar.value;localStorage.setItem("p",JSON.stringify(profile));register();msg("پاشەکەوت کرا")}
async function register(){socket.emit("register",profile);try{await fetch("/api/profile",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(profile)});let r=await fetch("/api/profile/"+profile.playerId).then(x=>x.json());if(r.player){stats.innerText=`Coins: ${r.player.coins} | XP: ${r.player.xp} | Wins: ${r.player.wins}`;rank.innerText=r.player.rank}}catch(e){}}
function findMatch(){socket.emit("findMatch");msg("گەڕان بۆ یاریزان...")}
function quickBot(){socket.emit("findMatch")}
function createRoom(){socket.emit("createRoom",{playerName:profile.avatar+" "+profile.name})}
function joinRoom(){socket.emit("joinRoom",{roomId:code.value,playerName:profile.avatar+" "+profile.name})}
function addBot(){socket.emit("addBot")}function startGame(){socket.emit("startGame")}function draw(){socket.emit("drawTile")}function pass(){socket.emit("passTurn")}
async function leaderboard(){leaders.style.display="block";let r=await fetch("/api/leaderboard").then(x=>x.json());leaders.innerHTML="<h3>Leaderboard</h3>"+(r.players||[]).map((p,i)=>`<p>${i+1}. ${p.avatar||"🎲"} ${p.name} - XP ${p.xp}</p>`).join("")}
function pips(n){let spots={0:[],1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]}[n]||[];return Array.from({length:9},(_,i)=>spots.includes(i)?'<i class="pip"></i>':'<i></i>').join("")}
function tile(t,ok=false){return `<div class="tile ${ok?'ok':''}"><div class="half">${pips(t.left)}</div><div class="half">${pips(t.right)}</div></div>`}
function can(t){if(!state||!state.board.length)return true;let l=state.board[0].left,r=state.board[state.board.length-1].right;return [t.left,t.right].includes(l)||[t.left,t.right].includes(r)}
function render(s){state=s;show("game");turn.innerText=s.yourTurn?"نۆرەی تۆیە":"نۆرەی "+s.currentPlayerName;counts.innerText="Board "+s.board.length+" | Stock "+s.boneyardCount;board.innerHTML=s.board.map(t=>tile(t)).join("")||"<b>یەکەم دۆمینۆ دابنێ</b>";hand.innerHTML=s.yourHand.map(t=>`<div onclick="play('${t.id}')">${tile(t,s.yourTurn&&can(t))}</div>`).join("");players.innerHTML=s.players.map(p=>`<div class="player">${p.avatar||"🎲"}<br>${p.name}<br>${p.tilesCount} دۆمینۆ</div>`).join("");if(s.winner){msg("براوە: "+s.winner.name);register()}}
function play(id){if(!state?.yourTurn)return;socket.emit("playTile",{tileId:id,side:"right"})}
socket.on("roomCreated",d=>{room.innerText=d.roomId;show("lobby")});socket.on("roomJoined",d=>{room.innerText=d.roomId;show("lobby")});socket.on("lobbyUpdate",d=>{room.innerText=d.roomId;lobbyPlayers.innerHTML=d.players.map(p=>`<div class="player">${p.avatar||"🎲"} ${p.name} ${p.isHost?"Host":""}</div>`).join("")});socket.on("gameState",render);socket.on("queueStatus",()=>msg("چاوەڕێی یاریزان..."));socket.on("error",e=>msg(e.message||"هەڵە"));
</script></body></html>
